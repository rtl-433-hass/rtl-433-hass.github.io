site_name: rtl_433 for Home Assistant
site_url: https://rtl-433-hass.github.io/
site_description: rtl_433 wireless sensors in Home Assistant — the add-on and the companion integration.
repo_url: https://github.com/rtl-433-hass
repo_name: rtl-433-hass

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
